<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Электронные часы</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: none;
    }
    video.hidden-cam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      display: block;
    }
    #controls {
      position: fixed;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      width: 85%;
      max-width: 320px;
    }
    button {
      padding: 16px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.75; }
    
    #clock-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 5;
    }
    #clock {
      font-family: "Courier New", Courier, monospace;
      font-size: 23vw;
      font-weight: bold;
      color: #00ff41;
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.45);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    #date {
      font-family: "Courier New", Courier, monospace;
      font-size: 4.5vw;
      color: #00b32d;
      margin-top: 10px;
    }
    #status {
      position: fixed;
      bottom: 20px;
      font-size: 13px;
      color: #cccccc;
      background: rgba(20, 20, 20, 0.85);
      padding: 8px 14px;
      border-radius: 8px;
      text-align: center;
      z-index: 20;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="startReceiver()">1. Экран (Смотреть и слушать)</button>
    <button onclick="startSender('user')">2. Камера: Фронтальная</button>
    <button onclick="startSender('environment')">3. Камера: Задняя</button>
  </div>

  <div id="clock-screen">
    <div id="clock">00:00</div>
    <div id="date">...</div>
  </div>

  <video id="video" autoplay playsinline></video>
  <div id="status">Выберите режим работы</div>

  <script>
    const ROOM_ID = 'de-cam-room-7482910';

    const PEER_CONFIG = {
      debug: 2,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:relay1.expressturn.com:3478',
            username: 'ef7972882268466466',
            credential: 'd565031755754695'
          }
        ],
        iceCandidatePoolSize: 10
      }
    };
    
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const controls = document.getElementById('controls');
    const clockScreen = document.getElementById('clock-screen');

    function setStatus(text, autoHide = false) {
      status.style.display = 'block';
      status.innerText = text;
      if (autoHide) {
        setTimeout(() => { status.style.display = 'none'; }, 4000);
      }
    }

    function startReceiver() {
      controls.style.display = 'none';
      setStatus('Подключение к серверу...');
      video.style.display = 'block';
      video.muted = false;
      keepScreenAwake();

      const peer = new Peer(ROOM_ID, PEER_CONFIG);

      peer.on('open', (id) => {
        setStatus('Комната открыта (' + id + '). Жду камеру...');
      });

      peer.on('call', (call) => {
        setStatus('Входящий сигнал от камеры...');
        call.answer();
        
        call.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
          video.play().then(() => {
            status.style.display = 'none';
          }).catch(() => {
            setStatus('Видео идет! Кликните по экрану, чтобы включить звук');
          });
        });

        call.on('close', () => {
          setStatus('Камера отключилась. Жду переподключения...');
        });
      });

      peer.on('disconnected', () => {
        setStatus('Связь с сервером прервана, восстанавливаю...');
        peer.reconnect();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          setStatus('Ошибка: эта комната уже занята! Поменяйте ROOM_ID в коде.');
        } else {
          setStatus('Ошибка сети: ' + err.type);
        }
      });
    }

    async function startSender(facingMode) {
      controls.style.display = 'none';
      setStatus('Запрос доступа к камере и микрофону...');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }, 
          audio: { echoCancellation: true, noiseSuppression: true } 
        });
        
        video.muted = true;
        video.srcObject = stream;
        video.classList.add('hidden-cam');
        
        clockScreen.style.display = 'flex';
        startClock();
        keepScreenAwake();
        setStatus('Камера включена. Подключаюсь к серверу...');

        const peer = new Peer(PEER_CONFIG);
        let activeCall = null;

        function connectToReceiver() {
          if (activeCall) {
            activeCall.close();
          }
          setStatus('Звоню на экран (' + ROOM_ID + ')...');
          activeCall = peer.call(ROOM_ID, stream);
          
          if (activeCall) {
            setTimeout(() => {
              if (activeCall && activeCall.open) {
                setStatus('Трансляция идет!', true);
              }
            }, 3000);

            activeCall.on('close', () => {
              setStatus('Связь закрыта. Повтор через 4 сек...');
              setTimeout(connectToReceiver, 4000);
            });
            activeCall.on('error', (e) => {
              setStatus('Ошибка звонка: ' + e.type);
              setTimeout(connectToReceiver, 4000);
            });
          }
        }

        peer.on('open', () => {
          connectToReceiver();
        });

        peer.on('disconnected', () => {
          setStatus('Переподключение к серверу...');
          peer.reconnect();
        });

        peer.on('error', (err) => {
          if (err.type === 'peer-unavailable') {
            setStatus('Ноутбук не найден в сети. Повтор через 4 сек...');
            setTimeout(connectToReceiver, 4000);
          } else {
            setStatus('Ошибка сети: ' + err.type);
            setTimeout(() => peer.reconnect(), 4000);
          }
        });

      } catch (err) {
        setStatus('ОШИБКА КАМЕРЫ: ' + err.name + ' (' + err.message + ')');
      }
    }

    function startClock() {
      const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
      const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

      function update() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').innerText = `${hours}:${mins}`;
        document.getElementById('date').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
      }
      update();
      setInterval(update, 1000);
    }

    async function keepScreenAwake() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        keepScreenAwake();
      }
    });

    function toggleFullScreen() {
      const docEl = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.body.addEventListener('click', () => {
      if (video.srcObject && video.paused) {
        video.play().then(() => {
          status.style.display = 'none';
        }).catch(() => {});
      }
    });

    document.body.addEventListener('dblclick', toggleFullScreen);
    let lastTap = 0;
    document.body.addEventListener('touchend', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      const currentTime = Date.now();
      if (currentTime - lastTap < 300 && currentTime - lastTap > 0) {
        e.preventDefault();
        toggleFullScreen();
      }
      lastTap = currentTime;
    });
  </script>

</body>
</html>
